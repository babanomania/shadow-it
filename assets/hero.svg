      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="#0b1220"/>
  <rect width="1280" height="480" fill="url(#grid)"/>

  <g font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" font-size="13">
